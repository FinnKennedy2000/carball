<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kart items — 3D</title>
    <link rel="stylesheet" href="./nocturne.css" />
    <style>
      body {
        margin: 0;
        background: var(--color-bg);
        color: var(--color-text);
        font-family: var(--font-body);
      }
      .wrap {
        display: grid;
        grid-template-columns: 300px 1fr;
        height: 100vh;
      }
      .rail {
        padding: var(--space-8) var(--space-6);
        display: flex;
        flex-direction: column;
        gap: var(--space-6);
        overflow-y: auto;
        box-shadow: inset -1px 0 0 var(--color-neutral-900);
      }
      .kick {
        font-size: 10px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--color-accent-400);
      }
      h1 {
        margin: 0;
        font-family: var(--font-heading);
        font-weight: 500;
        font-size: 26px;
        letter-spacing: -0.02em;
      }
      .rule {
        width: 120px;
        height: 1px;
        background: linear-gradient(90deg, var(--color-accent), transparent);
      }
      .list {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .pick {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: baseline;
        gap: var(--space-3);
        text-align: left;
        padding: var(--space-3) var(--space-4);
        border: 0;
        border-radius: var(--radius-md);
        background: transparent;
        color: var(--color-neutral-300);
        font: inherit;
        font-size: 14px;
        cursor: pointer;
      }
      .pick span {
        font-size: 11px;
        color: var(--color-neutral-600);
      }
      .pick:hover {
        background: color-mix(in oklab, var(--color-accent) 10%, transparent);
        color: var(--color-text);
      }
      .pick[aria-pressed='true'] {
        background: color-mix(in oklab, var(--color-accent) 16%, transparent);
        color: var(--color-accent-300);
        box-shadow: inset 0 0 0 1px var(--color-accent);
      }
      .note {
        font-size: 12px;
        line-height: 1.55;
        color: var(--color-neutral-500);
      }
      .stage {
        position: relative;
      }
      canvas {
        display: block;
      }
      .caption {
        position: absolute;
        left: var(--space-8);
        bottom: var(--space-8);
        display: flex;
        flex-direction: column;
        gap: 4px;
        pointer-events: none;
      }
      .caption b {
        font-family: var(--font-heading);
        font-weight: 500;
        font-size: 22px;
        letter-spacing: -0.01em;
      }
      .caption span {
        font-size: 12px;
        color: var(--color-neutral-500);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <aside class="rail">
        <div style="display: flex; flex-direction: column; gap: var(--space-3)">
          <div class="kick">Kart</div>
          <h1>Item models</h1>
          <div class="rule"></div>
        </div>
        <div class="list" id="list"></div>
        <p class="note">
          Built from primitives in <code>kart-items.js</code> — no asset files. The race scales them
          by 2.6 to sit beside a kart. Drag to turn one round.
        </p>
        <p class="note"><a class="btn btn-ghost" href="./kart">Back to the race</a></p>
      </aside>
      <div class="stage">
        <div class="caption"><b id="cap-name">—</b><span id="cap-note"></span></div>
      </div>
    </div>
    <script type="module" src="./kart-items-page.js"></script>
  </body>
</html>
