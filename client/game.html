<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Car Football</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="./nocturne.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <canvas id="view"></canvas>

    <div id="hud" hidden>
      <div id="labels"></div>
      <div id="roster"></div>

      <div id="room">
        <span class="kicker">Room</span>
        <b id="room-code">----</b>
      </div>

      <div id="scoreboard">
        <div class="board">
          <span class="side"><i class="bar blue"></i><span class="score" id="score-blue">0</span></span>
          <span class="middle">
            <span id="clock">5:00</span>
            <span id="clock-label"></span>
          </span>
          <span class="side"><span class="score" id="score-orange">0</span><i class="bar orange"></i></span>
        </div>
        <div class="board-rule"></div>
      </div>

      <div id="banner-wrap">
        <div id="banner"></div>
        <div id="banner-sub"></div>
      </div>

      <!-- The waiting room, in the footer's place: boost and the controls line
           mean nothing until the cars move, and the code is what gets shared. -->
      <div id="waiting" hidden>
        <div class="waiting-rule"></div>
        <div id="waiting-strip">
          <div class="stack">
            <span class="kicker">Room code</span>
            <b id="waiting-code">----</b>
          </div>
          <span class="waiting-divider"></span>
          <div class="stack">
            <span class="kicker">On the pitch</span>
            <div id="waiting-counts">
              <span><i class="dot blue"></i><b id="count-blue">0</b></span>
              <span><i class="dot orange"></i><b id="count-orange">0</b></span>
              <span class="of" id="count-total">0 of 6</span>
            </div>
          </div>
          <div class="row">
            <button id="invite" class="btn btn-secondary" hidden>Copy invite link</button>
            <button id="start" class="btn btn-primary" hidden>Start match</button>
          </div>
        </div>
        <div id="waiting-hint"></div>
        <div id="waiting-mode"></div>
      </div>

      <div id="footer">
        <div id="boost-row">
          <span class="kicker">Boost</span>
          <div id="boost-wrap"><div id="boost"></div></div>
          <span id="boost-pct">0</span>
          <!-- Rumble only: what is in your hand, or how long until something is. -->
          <div id="item-chip" hidden>
            <span class="kicker">Item</span>
            <b id="item-name">—</b>
            <span id="item-hint"></span>
          </div>
        </div>
        <div id="controls-line">WASD drive · space boost · shift drift · M mute</div>
      </div>
    </div>

    <div id="over" hidden>
      <div id="over-inner">
        <div class="stack">
          <div class="kicker">Full time · room <span id="over-code"></span></div>
          <h2 id="over-verdict"></h2>
          <div id="over-score">
            <span class="blue" id="over-blue">0</span>
            <span class="dash">–</span>
            <span class="orange" id="over-orange">0</span>
          </div>
          <div class="accent-rule wide"></div>
        </div>

        <div id="over-teams"></div>

        <div class="row">
          <button id="over-again" class="btn btn-primary">Play again</button>
          <button id="over-copy" class="btn btn-secondary">Copy room link</button>
          <button id="over-home" class="btn btn-ghost">Back to home</button>
        </div>
      </div>
    </div>

    <!-- Shown until the room takes us: the name prompt for a guest arriving on
         an invite link, and the place any join error is reported. -->
    <div id="gate">
      <div id="gate-card" class="stack wide-gap">
        <div class="kicker accent" id="gate-kicker">Car Football</div>
        <h2 id="gate-title">Joining…</h2>
        <div class="field" id="gate-name-field" hidden>
          <label for="gate-name">Your name</label>
          <input id="gate-name" class="input" placeholder="your name" maxlength="16" autocomplete="off" />
        </div>
        <div class="row">
          <button id="gate-go" class="btn btn-primary" hidden>Join</button>
          <a class="btn btn-ghost" href="./">Back to home</a>
        </div>
        <p id="gate-note"></p>
      </div>
    </div>

    <script type="module" src="./game.js"></script>
  </body>
</html>
